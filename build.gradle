plugins {
    id 'fabric-loom' version "1.18-SNAPSHOT"
    id 'maven-publish'
}

version = project.mod_version.toString().replaceFirst(/^v/, '')
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }
        return result.getResult().get().getExitValue() != 0 ? "<UnknownCommit>" : result.standardOutput.asText.get().strip()
    } catch (Exception e) {
        return "<UnknownCommit>"
    }
}

def buildtime = { System.currentTimeSeconds() }
processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version.toString().replaceFirst(/^v/, '')

    inputs.properties("version": version, "commit": hash, "buildtime": time)
    filesMatching("fabric.mod.json") {
        expand "version": version, "commit": hash, "buildtime": time
    }
}

loom {
    if (!project.hasProperty('yarn_mappings') || project.property('yarn_mappings').toString().trim().isEmpty()) {
        noIntermediateMappings()
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.hasProperty('yarn_mappings') && !project.property('yarn_mappings').toString().trim().isEmpty()) {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    } else {
        mappings files("empty-mappings.jar")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    def fabricApi = project.findProperty('fabric_api_version') ?: project.findProperty('fabric_version')
    if (fabricApi) {
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    }
}

def targetJavaVersion = project.minecraft_version.startsWith('26') ? 25 : 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("src/main/resources/assets/mrmousenavigation/icon.png")
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

remapJar {
    archiveFileName = "${project.archives_base_name}.jar"
}

tasks.matching { it.name == 'sourcesJar' || it.name == 'remapSourcesJar' || it.name == 'javadocJar' }.configureEach {
    enabled = false
}

sourceSets {
    neoforge {
        java {
            srcDirs = ['src/neoforge/java']
        }
        resources {
            srcDirs = ['src/neoforge/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

processNeoforgeResources {
    def neoforgeVersion = project.version.toString().replaceFirst(/^v/, '')
    inputs.property "version", neoforgeVersion
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": neoforgeVersion, "minecraft_version": project.minecraft_version
    }
}

task jarNeoForge(type: Jar) {
    dependsOn compileNeoforgeJava, processNeoforgeResources
    archiveFileName = "${project.archives_base_name.replace('-Fabric-', '-NeoForge-')}.jar"
    destinationDirectory = layout.buildDirectory.dir("libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        exclude "com/mr712/mrmousenavigation/MouseNavigationClient.class"
        exclude "com/mr712/mrmousenavigation/integration/**"
        exclude "com/terraformersmc/**"
        exclude "fabric.mod.json"
    }
    from(sourceSets.neoforge.output) {
        exclude "net/**"
    }
    from("src/main/resources") {
        include "assets/**"
        include "mrmousenavigation.mixins.json"
    }
    from("src/main/resources/assets/mrmousenavigation/icon.png")
    from("LICENSE")
}

build.dependsOn(jarNeoForge)

def allBuildsDir = file("C:/Users/Mr712/Documents/MrMouseNavigation_all_builds")
tasks.register('copyToAllBuildsFabric', Copy) {
    dependsOn remapJar
    from remapJar.archiveFile
    into file("${allBuildsDir}/Fabric")
    doLast {
        copy {
            from remapJar.archiveFile
            into allBuildsDir
        }
        println ">>> Copied ${remapJar.archiveFileName.get()} to ${allBuildsDir.absolutePath}/Fabric!"
    }
}

tasks.register('copyToAllBuildsNeoForge', Copy) {
    dependsOn jarNeoForge
    from jarNeoForge.archiveFile
    into file("${allBuildsDir}/NeoForge")
    doLast {
        copy {
            from jarNeoForge.archiveFile
            into allBuildsDir
        }
        println ">>> Copied ${jarNeoForge.archiveFileName.get()} to ${allBuildsDir.absolutePath}/NeoForge!"
    }
}

task copyToAllBuilds {
    dependsOn copyToAllBuildsFabric, copyToAllBuildsNeoForge
}

build.finalizedBy(copyToAllBuilds)

